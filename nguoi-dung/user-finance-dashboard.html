<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f3">
  <title>SpendWise | Tổng quan tài chính</title>
</head>
<body>
  <div class="page page--user page--user-finance-dashboard">
    <div class="page-layout">
      <div class="page-sidebar">
        <div class="sidebar-brand"></div>
        <div class="sidebar-navigation">
          <div class="navigation-group navigation-group--user">
            <div class="navigation-item navigation-item--user-ai-recommendations"></div>
            <div class="navigation-item navigation-item--user-budget-management"></div>
            <div class="navigation-item navigation-item--user-finance-dashboard is-current"></div>
            <div class="navigation-item navigation-item--user-saving-goals"></div>
            <div class="navigation-item navigation-item--user-spending-insights"></div>
            <div class="navigation-item navigation-item--user-transaction-management"></div>
          </div>
        </div>
        <div class="sidebar-account-area">
          <div class="account-profile"></div>
          <div class="account-settings"></div>
        </div>
      </div>
      <div class="page-main">
        <div class="page-topbar">
          <div class="breadcrumb-area"></div>
          <div class="account-area"></div>
        </div>
        <div class="page-header">
          <div class="page-heading"></div>
          <div class="page-actions">
            <div class="page-action page-action--primary"></div>
            <div class="page-action page-action--secondary"></div>
          </div>
        </div>
        <div class="summary-grid">
          <div class="summary-card summary-card--1"></div>
          <div class="summary-card summary-card--2"></div>
          <div class="summary-card summary-card--3"></div>
          <div class="summary-card summary-card--4"></div>
        </div>
        <div class="page-content page-content--dashboard">
          <div class="dashboard-main">
            <div class="overview-panel"></div>
            <div class="activity-panel"></div>
          </div>
          <div class="dashboard-aside">
            <div class="alerts-panel"></div>
            <div class="recent-items-panel"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
