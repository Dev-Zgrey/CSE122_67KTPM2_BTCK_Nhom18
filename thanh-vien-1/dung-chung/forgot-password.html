<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt lại mật khẩu</title>
  <link rel="stylesheet" href="forgot-password.css">
  <script src="forgot-password.js" defer></script>
</head>
<body>
  <div class="container" data-account-root data-static-account>
    <header class="header"><a class="brand" href="index.html"><span class="brand-mark">S</span>SpendWise</a><nav class="header-links"><a href="index.html">Trang chủ</a><a href="login.html">Đăng nhập</a></nav></header>
    <main class="main"><section class="card"><h1>Đặt lại mật khẩu</h1><p>Bản demo đổi mật khẩu cục bộ, không gửi email hoặc mã xác nhận.</p><form class="form" data-form><div class="field"><label for="email">Email tài khoản *</label><input id="email" name="email" type="email" value="" placeholder="" required autocomplete="email"></div><div class="field"><label for="password">Mật khẩu mới *</label><input id="password" name="password" type="password" value="" placeholder="" required ></div><div class="field"><label for="confirm">Xác nhận mật khẩu mới *</label><input id="confirm" name="confirm" type="password" value="" placeholder="" required ></div><div class="error" data-error role="alert"></div><button class="button" type="submit">Cập nhật mật khẩu</button><div class="success" data-success hidden></div></form></section><div class="divider"><a href="login.html">Quay lại đăng nhập</a></div></main>
    <footer class="footer">SpendWise · Bản demo frontend · Dữ liệu chỉ lưu trên trình duyệt</footer>
  </div>
</body>
</html>
