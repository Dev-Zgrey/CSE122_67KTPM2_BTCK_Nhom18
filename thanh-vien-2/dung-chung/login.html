<!doctype html>
<!-- Trang đăng nhập dùng chung: nhập thông tin, chọn vai trò demo và chuyển đến màn hình tương ứng. -->
<!-- GHI CHÚ: Cấu trúc trang đăng nhập; form và các data-* liên kết với xử lý JavaScript. -->
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title><script src="../../workspace-loader.js" data-group="account-auth"></script>
    <link rel="stylesheet" href="../../workspace-tabs.css">
    <script src="../../workspace-tabs.js" defer></script>
  </head>
  <body data-account-group="account-auth">
    <div class="container" data-account-root>
      <header class="header">
        <a class="brand" href="index.html"><span class="brand-mark">S</span>SpendWise</a>
        <nav class="header-links">
          <a href="index.html">
            Trang chủ
          </a>
          <a href="login.html">
            Đăng nhập
          </a>
        </nav>
      </header>
      <main class="main">
        <section class="card">
          <h1>
            Đăng nhập
          </h1>
          <p>
            Đăng nhập để tiếp tục hành trình tài chính của bạn.
          </p>
          <form class="form" data-form>
            <div class="field">
              <label for="email">Email *</label><input id="email" name="email" type="email" value="an.tran@spendwise.demo" placeholder="" required autocomplete="email">
            </div>
            <div class="field">
              <label for="password">Mật khẩu *</label><input id="password" name="password" type="password" value="spendwise" placeholder="" required >
            </div>
            <div class="field">
              <label for="role">Vai trò demo</label><select id="role" name="role">
              <option value="user">
                Người dùng
              </option>
              <option value="coach">
                Huấn luyện viên
              </option>
              <option value="moderator">
                Kiểm duyệt viên
              </option>
              <option value="admin">
                Quản trị viên
              </option>
              </select>
            </div>
            <label class="checkbox"><input name="remember" type="checkbox" checked><span>Ghi nhớ phiên đăng nhập trên thiết bị này</span></label>
            <div class="error" data-error role="alert">
            </div>
            <button class="button" type="submit">Đăng nhập vào SpendWise</button>
            <div class="success" data-success hidden>
            </div>
          </form>
        </section>
        <div class="divider">
          <a href="forgot-password.html">Quên mật khẩu?</a><a href="register.html">Tạo tài khoản</a>
        </div>
        <div class="success" style="margin-top:14px">
          Tài khoản demo: <b>an.tran@spendwise.demo</b> · Mật khẩu: <b>spendwise</b>. Chọn vai trò để mở các màn hình tương ứng.
        </div>
      </main>
      <footer class="footer">
        SpendWise · Bản demo frontend · Dữ liệu chỉ lưu trên trình duyệt
      </footer>
    </div>
  </body>
</html>
