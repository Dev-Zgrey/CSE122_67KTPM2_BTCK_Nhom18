<!doctype html>
<!-- Trang đặt lại mật khẩu demo: thu thập email và mật khẩu mới để xử lý ở JavaScript phía trình duyệt. -->
<!-- GHI CHÚ: Trang nhập yêu cầu khôi phục mật khẩu. Các trường form được JavaScript tìm qua thuộc tính data-*. -->
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="forgot-password.css">
    <script src="forgot-password.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a class="brand" href="../../index.html"><span class="brand-mark">S</span>SpendWise</a>
        <nav class="header-links">
          <a href="../../index.html">Trang chủ</a>
          <a href="login.html">Đăng nhập</a>
        </nav>
      </header>
      <main class="main">
        <section class="card">
          <h1>Đặt lại mật khẩu</h1>
          <p>Nhập email tài khoản demo và mật khẩu mới bạn muốn đổi.</p>
          <form class="form" data-form>
            <div class="field">
              <label for="email">Email tài khoản *</label>
              <input id="email" name="email" type="email" placeholder="ban@example.com" required autocomplete="email">
            </div>
            <div class="field">
              <label for="password">Mật khẩu mới *</label>
              <input id="password" name="password" type="password" placeholder="Ít nhất 6 ký tự" required>
            </div>
            <div class="field">
              <label for="confirm">Xác nhận mật khẩu mới *</label>
              <input id="confirm" name="confirm" type="password" placeholder="Nhập lại mật khẩu" required>
            </div>
            <div class="error" data-error role="alert"></div>
            <button class="button" type="submit">Cập nhật mật khẩu</button>
            <div class="success" data-success hidden></div>
          </form>
        </section>
        <div class="divider">
          <a href="login.html">Quay lại đăng nhập</a>
          <a href="register.html">Tạo tài khoản mới</a>
        </div>
      </main>
      <footer class="footer">
        SpendWise · Bản demo frontend · Dữ liệu chỉ lưu trên trình duyệt
      </footer>
    </div>
  </body>
</html>
