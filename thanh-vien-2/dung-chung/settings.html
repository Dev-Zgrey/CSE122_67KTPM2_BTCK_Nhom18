<!doctype html>


<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cài đặt hệ thống demo</title>
    <link rel="stylesheet" href="settings.css">
    <script src="settings.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a class="brand" href="../../index.html"><span class="brand-mark">S</span>SpendWise</a>
        <nav class="header-links">
          <a href="../../index.html">Trang chủ</a>
          <a href="profile.html">Hồ sơ</a>
          <a href="login.html">Đăng nhập</a>
        </nav>
      </header>
      <main class="main">
        <section class="card">
          <h1>Cài đặt</h1>
          <p>Tùy chỉnh trải nghiệm demo SpendWise trên thiết bị này.</p>
          <form class="form" data-form>
            <div class="field">
              <label for="currency">Đơn vị tiền tệ</label>
              <select name="currency" id="currency">
                <option value="VND">VND — Đồng Việt Nam</option>
                <option value="USD">USD — Đô la Mỹ</option>
              </select>
            </div>
            <div class="field">
              <label for="timezone">Múi giờ</label>
              <select name="timezone" id="timezone">
                <option value="Asia/Ho_Chi_Minh">Việt Nam (UTC+7)</option>
                <option value="UTC">UTC (Quốc tế)</option>
              </select>
            </div>
            <label class="checkbox">
              <input name="notifications" type="checkbox" checked>
              <span>Cho phép thông báo trong bản demo</span>
            </label>
            <div class="error" data-error role="alert"></div>
            <button class="button" type="submit">Lưu cài đặt</button>
            <button class="button button-secondary" type="button" data-signout>Đăng xuất</button>
            <button class="button button-secondary" type="button" data-reset style="color:#b9584c">Đặt lại toàn bộ dữ liệu demo</button>
            <div class="success" data-success hidden></div>
          </form>
        </section>
      </main>
      <footer class="footer">
        SpendWise · Bản demo frontend · Dữ liệu chỉ lưu trên trình duyệt
      </footer>
    </div>
  </body>
</html>
