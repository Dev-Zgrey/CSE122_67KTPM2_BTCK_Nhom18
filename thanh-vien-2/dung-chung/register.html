<!doctype html>

<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="register.css">
    <script src="register.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a class="brand" href="../../index.html"><span class="brand-mark">S</span>SpendWise</a>
        <nav class="header-links">
          <a href="../../index.html">Trang chủ</a>
          <a href="login.html">Đăng nhập</a>
        </nav>
      </header>
      <main class="main">
        <section class="card">
          <h1>Tạo tài khoản</h1>
          <p>Bắt đầu xây dựng thói quen tài chính lành mạnh cùng SpendWise.</p>
          <form class="form" data-form>
            <div class="field">
              <label for="name">Họ và tên *</label>
              <input id="name" name="name" type="text" placeholder="Tên hiển thị" required>
            </div>
            <div class="field">
              <label for="email">Email *</label>
              <input id="email" name="email" type="email" placeholder="ban@example.com" required autocomplete="email">
            </div>
            <div class="field">
              <label for="password">Mật khẩu *</label>
              <input id="password" name="password" type="password" placeholder="Ít nhất 6 ký tự" required>
            </div>
            <div class="field">
              <label for="confirm">Xác nhận mật khẩu *</label>
              <input id="confirm" name="confirm" type="password" placeholder="Nhập lại mật khẩu" required>
            </div>
            <label class="checkbox">
              <input name="terms" type="checkbox" required checked>
              <span>Tôi đồng ý với điều khoản sử dụng và chính sách quyền riêng tư.</span>
            </label>
            <div class="error" data-error role="alert"></div>
            <button class="button" type="submit">Tạo tài khoản</button>
            <div class="success" data-success hidden></div>
          </form>
        </section>
        <div class="divider">
          <span>Đã có tài khoản?</span>
          <a href="login.html">Đăng nhập</a>
        </div>
      </main>
      <footer class="footer">
        SpendWise · Bản demo frontend · Dữ liệu chỉ lưu trên trình duyệt
      </footer>
    </div>
  </body>
</html>
