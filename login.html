<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Đăng nhập</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="container">
        <div class="login-form">
            <div class="login-head">
                <div class="logo">
                    <span aria-hidden="true">◔</span>
                </div>
                <h1>SpendWise</h1>
            </div>
            <div class="login-main">
                <div class="input-group">
                    <input type="text" placeholder="Tài khoản" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Mật khẩu" required>
                </div>
            </div>
            <div class="login-footer">
                <button type="button" class="btn-submit" onclick="window.location.href='index2.html'">Đăng nhập vào SpendWise</button>
                <div class="register">
                    <p>Chưa có tài khoản?</p>
                    <button type="button" class="btn-register" onclick="alert('Form đăng ký sẽ được mở trong bản tiếp theo.')">Đăng ký ngay</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
